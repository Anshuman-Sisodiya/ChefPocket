name: Check import service
on:
  push:
    paths: ['server/**', '.github/workflows/check-import.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/check-import.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
        working-directory: server
