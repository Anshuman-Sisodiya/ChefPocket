name: Build iPhone 13 IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Backup Info Plists
        run: |
          cp ChefPocket/Info.plist /tmp/orig_app_info.plist
          cp RecipeShareExtension/Info.plist /tmp/orig_ext_info.plist

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          python3 -c "
          p = 'ChefPocket.xcodeproj/project.pbxproj'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('objectVersion = 77;', 'objectVersion = 56;').replace('compatibilityVersion = \"Xcode 16.0\";', 'compatibilityVersion = \"Xcode 15.0\";')
          with open(p, 'w') as f:
              f.write(c)
          "

      - name: Build Unsigned App
        run: |
          xcodebuild clean build \
            -project ChefPocket.xcodeproj \
            -scheme ChefPocket \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA & Inject Plists
        run: |
          mkdir -p Payload
          APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "ChefPocket.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: ChefPocket.app not found!"
            find derived_data -type d -name "*.app"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/

          # Merge and verify all required Plist keys into the compiled app and extension
          python3 -c "
          import plistlib, os

          # Main app plist injection
          app_plist = 'Payload/ChefPocket.app/Info.plist'
          with open('/tmp/orig_app_info.plist', 'rb') as f:
              src_app = plistlib.load(f)
          with open(app_plist, 'rb') as f:
              dest_app = plistlib.load(f)
          for k, v in src_app.items():
              if k not in ['CFBundleIdentifier', 'CFBundleExecutable', 'CFBundleName']:
                  dest_app[k] = v
          with open(app_plist, 'wb') as f:
              plistlib.dump(dest_app, f)

          # Extension plist injection (guarantees NSExtension is present)
          ext_plist = 'Payload/ChefPocket.app/PlugIns/RecipeShareExtension.appex/Info.plist'
          if os.path.exists(ext_plist):
              with open('/tmp/orig_ext_info.plist', 'rb') as f:
                  src_ext = plistlib.load(f)
              with open(ext_plist, 'rb') as f:
                  dest_ext = plistlib.load(f)
              for k, v in src_ext.items():
                  if k not in ['CFBundleIdentifier', 'CFBundleExecutable', 'CFBundleName']:
                      dest_ext[k] = v
              with open(ext_plist, 'wb') as f:
                  plistlib.dump(dest_ext, f)
              
              # Assert validation
              with open(ext_plist, 'rb') as f:
                  check = plistlib.load(f)
              assert 'NSExtension' in check, 'CRITICAL: NSExtension missing from extension Info.plist!'
              print('Extension Info.plist successfully verified and merged with NSExtension:', check['NSExtension'])
          "

          zip -r ChefPocket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChefPocket-iPhone13-IPA
          path: ChefPocket.ipa
