name: ChefPocket
options:
  bundleIdPrefix: com.chefpocket
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

targets:
  ChefPocket:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ChefPocket
        excludes:
          - "Info.plist"
    info:
      path: ChefPocket/Info.plist
      properties:
        CFBundleDisplayName: ChefPocket
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.chefpocket.app
            CFBundleURLSchemes:
              - chefpocket
    settings:
      GENERATE_INFOPLIST_FILE: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.chefpocket.app
      INFOPLIST_FILE: ChefPocket/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Dark"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: RecipeShareExtension

  RecipeShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RecipeShareExtension
        excludes:
          - "Info.plist"
    info:
      path: RecipeShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ChefPocket
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.share-services"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (
                  extensionItems,
                  $extensionItem,
                  SUBQUERY (
                      $extensionItem.attachments,
                      $attachment,
                      ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                      OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
                  ).@count >= 1
              ).@count >= 1
    settings:
      GENERATE_INFOPLIST_FILE: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.chefpocket.app.share
      INFOPLIST_FILE: RecipeShareExtension/Info.plist
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
